<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; }
  ::selection { background: #d4d4d8; }
</style>
</helmet>
<div style="min-height:100vh; background:#f4f4f5; padding:40px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#18181b;">
  <div style="max-width:1240px; margin:0 auto;">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <div>
        <h1 style="font-size:24px; font-weight:600; margin:0 0 4px 0; color:#18181b;">Reisen</h1>
      </div>
      <button style="background:#18181b; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:500; cursor:pointer;">+ Neue Reise</button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">
      <sc-for list="{{ trips }}" as="trip" hint-placeholder-count="4">
        <div style="background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; transition:box-shadow .15s; cursor:pointer;">
          <div style="width:100%; height:130px;">
            <image-slot id="{{ trip.imageSlotId }}" shape="rect" placeholder="{{ trip.imagePlaceholder }}"></image-slot>
          </div>
          <div style="padding:16px 20px 20px 20px;">
          <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom:16px;">
            <div style="flex:1; min-width:0;">
              <p style="font-weight:600; font-size:15px; margin:0 0 2px 0; color:#18181b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ trip.name }}</p>
              <p style="font-size:12px; color:#a1a1aa; margin:0;">{{ trip.dateRangeLabel }}</p>
            </div>
          </div>

          <span style="display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:500; background:{{ trip.countPill.bg }}; color:{{ trip.countPill.color }};">{{ trip.hotelLabel }}</span>

          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding-top:14px; border-top:1px solid #f0f0f1;">
            <span style="display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:500; color:#18181b;">
              Ansehen
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            </span>
            <div style="display:flex; gap:10px; align-items:center;">
              <span style="cursor:pointer;" title="Bearbeiten">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              </span>
              <span style="cursor:pointer;" title="Löschen">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </span>
            </div>
          </div>
          </div>
        </div>
      </sc-for>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  rawTrips() {
    return [
      { id: 1, name: "Griechenland Sommer 2026", hotels: 6, start: "2026-07-12", end: "2026-07-19" },
      { id: 2, name: "Städtetrip Lissabon", hotels: 3, start: "2026-09-03", end: "2026-09-06" },
      { id: 3, name: "Roadtrip Toskana", hotels: 8, start: "2026-05-22", end: "2026-06-02" },
      { id: 4, name: "Skiferien Zermatt", hotels: 1, start: "2027-01-16", end: "2027-01-23" },
      { id: 5, name: "Japan Herbst", hotels: 0, start: "2026-10-28", end: "2026-11-09" },
    ];
  }

  monthsDe = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

  dateRangeLabel(startStr, endStr) {
    const start = new Date(startStr);
    const end = new Date(endStr);
    const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
    const startDay = start.getDate();
    const endDay = end.getDate();
    const endPart = `${endDay}. ${this.monthsDe[end.getMonth()]} ${end.getFullYear()}`;
    if (sameMonth) return `${startDay}.–${endPart}`;
    return `${startDay}. ${this.monthsDe[start.getMonth()]} – ${endPart}`;
  }

  avatarColor(name) {
    const colors = ["#52525b", "#3f6212", "#0e7490", "#7c3aed", "#b91c1c", "#c2410c"];
    let sum = 0;
    for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return colors[sum % colors.length];
  }

  countPillStyle(n) {
    if (n === 0) return { bg: "#f4f4f5", color: "#71717a" };
    if (n >= 5) return { bg: "#ecfdf5", color: "#059669" };
    return { bg: "#eff6ff", color: "#2563eb" };
  }

  createdLabel(daysAgo) {
    if (daysAgo === 0) return "heute";
    if (daysAgo === 1) return "vor 1 Tag";
    if (daysAgo < 30) return `vor ${daysAgo} Tagen`;
    const months = Math.round(daysAgo / 30);
    return months === 1 ? "vor 1 Monat" : `vor ${months} Monaten`;
  }

  renderVals() {
    const raw = this.rawTrips();
    const trips = raw.map((t) => ({
      ...t,
      avatarBg: this.avatarColor(t.name),
      countPill: this.countPillStyle(t.hotels),
      hotelLabel: t.hotels === 0 ? "Keine Hotels" : t.hotels === 1 ? "1 Hotel" : `${t.hotels} Hotels`,
      dateRangeLabel: this.dateRangeLabel(t.start, t.end),
      imageSlotId: `trip-photo-${t.id}`,
      imagePlaceholder: `Foto für ${t.name}`,
    }));
    return { trips, tripCount: trips.length };
  }
}
</script>
</body>
</html>
