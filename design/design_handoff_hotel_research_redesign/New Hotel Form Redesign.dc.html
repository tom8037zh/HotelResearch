<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  body { margin: 0; }
  ::selection { background: #d4d4d8; }
  input:focus, textarea:focus { outline: none; border-color: #a1a1aa !important; }
</style>
</helmet>
<div style="min-height:100vh; background:#f4f4f5; padding:40px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#18181b;">
  <div style="max-width:520px; margin:0 auto;">

    <a href="#" style="font-size:13px; color:#71717a; text-decoration:none; display:inline-block; margin-bottom:16px;">← Zurück zu Griechenland Sommer 2026</a>
    <h1 style="font-size:24px; font-weight:600; margin:0 0 24px 0; color:#18181b;">Neues Hotel</h1>

    <div style="background:#fff; border:1px solid #e4e4e7; border-radius:14px; padding:28px;">
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:20px;">
        <label style="font-size:13px; font-weight:500; color:#18181b;">Hotel</label>
        <input type="text" placeholder="Hotelname" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e4e4e7; border-radius:8px; font-size:14px; color:#18181b; font-family:inherit;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:20px;">
        <label style="font-size:13px; font-weight:500; color:#18181b;">Link zu Google Maps</label>
        <input type="url" placeholder="https://www.google.com/maps/place/..." style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e4e4e7; border-radius:8px; font-size:14px; color:#18181b; font-family:inherit;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:20px;">
        <label style="font-size:13px; font-weight:500; color:#18181b;">Link zu TripAdvisor <span style="color:#a1a1aa; font-weight:400;">(optional)</span></label>
        <input type="url" placeholder="https://www.tripadvisor.com/Hotel_Review-..." style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e4e4e7; border-radius:8px; font-size:14px; color:#18181b; font-family:inherit;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:20px;">
        <label style="font-size:13px; font-weight:500; color:#18181b;">Link zu Booking.com <span style="color:#a1a1aa; font-weight:400;">(optional)</span></label>
        <input type="url" placeholder="https://www.booking.com/hotel/..." style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e4e4e7; border-radius:8px; font-size:14px; color:#18181b; font-family:inherit;" />
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:24px;">
        <label style="font-size:13px; font-weight:500; color:#18181b;">Bemerkungen</label>
        <textarea rows="4" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #e4e4e7; border-radius:8px; font-size:14px; color:#18181b; font-family:inherit; resize:vertical;"></textarea>
      </div>

      <button style="width:100%; background:#18181b; color:#fff; border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:500; cursor:pointer;">Speichern</button>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
